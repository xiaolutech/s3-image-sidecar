name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (unit)
        run: go test -timeout 180s -count=1 ./internal/config/... ./internal/imageopt/... ./internal/worker/... ./cmd/...

      - name: Test (integration with MinIO)
        run: go test -timeout 180s -count=1 ./internal/storage/...